name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Online end-to-end test
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          npm run test:e2e
          E2E_PLAYERS=2 E2E_P2P=0 E2E_DROP=0.3 npm run test:e2e
          E2E_PLAYERS=4 E2E_ARENA=erasers npm run test:e2e
          E2E_PLAYERS=3 E2E_LEAVE=1 E2E_ARENA=square npm run test:e2e
